<script type="module">
import * as THREE from 'three';

// ===== game constants (same logic space as the 2D version) =====
const W=480,H=720,LANES=5,ROAD_L=40,ROAD_W=400,LW=ROAD_W/LANES;
const CW=34,CH=60,S=1/20;               // S: game px -> 3D units
const SPAWN_Y=-1000;
const laneX=i=>ROAD_L+LW*(i+0.5);
let state='title',player,cars=[],shells=[],parts=[],popups=[],speed=180,dist=0,score=0,near=0,combo=0,comboT=0,t=0,spawnT=0,shake=0,flash=0;
let best=+localStorage.getItem('wwr_best')||0;
const keys={};let touchDir=0;
const CARS=[
  {name:'STANDARD',col:0x00e5ff,acc:1,steer:1,maxc:3,beam:false,tank:false,w:34,h:60,desc:''},
  {name:'PHANTOM X',col:0xffc400,acc:1.5,steer:1.35,maxc:5,beam:true,tank:false,w:34,h:60,desc:'（加速・旋回UP / ハイビーム / ターボ5回）'}, // unlocked at score 1000
  {name:'TITAN TANK',col:0x6b8e23,acc:1,steer:1.35,maxc:5,beam:false,tank:true,w:62,h:95,desc:'（旋回UP / 大型 / 主砲5発で前方を爆破・15秒で1発補給）'}    // unlocked at score 3000
];
let savedUnlock=+localStorage.getItem('wwr_unlock')||0;
let unlockLv=Math.max(savedUnlock,best>=3000?2:best>=1000?1:0);
let carType=Math.min(+localStorage.getItem('wwr_car')||0,unlockLv),unlockT=0,unlockText='';
let MAXC=CARS[carType].maxc;
let charges=3,boostT=0,cdT=0,rechT=0,boost=0;const BOOST_DUR=2,BOOST_CD=4,RECH=12,BOOST_K=0.5;
const $=id=>document.getElementById(id);

// ===== BGM & SE setup (Blob事前ロード・メモリ保持) =====
function preloadAudio(url, loop=false){
  const a=new Audio();
  a.loop=loop;
  a.preload='auto';
  fetch(url)
    .then(r=>{if(!r.ok)throw new Error();return r.blob();})
    .then(blob=>{a.src=URL.createObjectURL(blob);a.load();})
    .catch(()=>{a.src=url;a.load();}); // ローカル直接起動(file://)用フォールバック
  return a;
}

const bgms=[
  preloadAudio('sounds/bgm/ariake_euro.mp3', true),
  preloadAudio('sounds/bgm/tensui_euro.mp3', true),
  preloadAudio('sounds/bgm/shingun.mp3', true)
];
const fireSe=preloadAudio('sounds/se/tank-cannon.mp3');
const hitSe=preloadAudio('sounds/se/big-explosion.mp3');

function playBgm(){
  bgms.forEach(a=>a.pause());
  const b=bgms[carType]||bgms[1];
  if(b){b.currentTime=0;b.play().catch(()=>{});}
}
function stopBgm(){bgms.forEach(a=>a.pause());}

function playFireSe(){
  fireSe.currentTime=0;
  fireSe.play().catch(()=>{});
}
function playHitSe(){
  hitSe.currentTime=0;
  hitSe.play().catch(()=>{});
}

// ===== three.js setup =====
const cv=$('c');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();
const SKY=0x0a0c18;
scene.background=new THREE.Color(SKY);
scene.fog=new THREE.Fog(SKY,30,95);
const camera=new THREE.PerspectiveCamera(65,1,0.1,200);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

scene.add(new THREE.HemisphereLight(0x8899cc,0x222233,1.0));
const sun=new THREE.DirectionalLight(0xffffff,1.0);
sun.position.set(-8,20,10);sun.castShadow=true;
sun.shadow.camera.left=-20;sun.shadow.camera.right=20;sun.shadow.camera.top=30;sun.shadow.camera.bottom=-30;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);scene.add(sun.target);

// world mapping: game (x,y) -> 3D (X,Z). Bigger y = closer to camera.
const gx=x=>(x-W/2)*S;
const gz=y=>(y-(H-150))*S;

// ===== road =====
function roadTexture(){
  const c=document.createElement('canvas');c.width=400;c.height=80;
  const g=c.getContext('2d');
  g.fillStyle='#333';g.fillRect(0,0,400,80);
  g.fillStyle='#bbb';
  for(let i=1;i<LANES;i++)g.fillRect(LW*i-2,0,4,40);
  g.fillStyle='#ddd';g.fillRect(0,0,3,80);g.fillRect(397,0,3,80);
  const tx=new THREE.CanvasTexture(c);
  tx.wrapT=THREE.RepeatWrapping;tx.anisotropy=8;tx.colorSpace=THREE.SRGBColorSpace;
  return tx;
}
const ROAD_LEN=240;
const roadTex=roadTexture();roadTex.repeat.set(1,ROAD_LEN/(80*S));
const road=new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W*S,ROAD_LEN),new THREE.MeshStandardMaterial({map:roadTex,roughness:.9}));
road.rotation.x=-Math.PI/2;road.position.set(0,0,-ROAD_LEN/2+30);road.receiveShadow=true;
scene.add(road);
const grass=new THREE.Mesh(new THREE.PlaneGeometry(200,ROAD_LEN),new THREE.MeshStandardMaterial({color:0x16311a,roughness:1}));
grass.rotation.x=-Math.PI/2;grass.position.set(0,-0.02,-ROAD_LEN/2+30);grass.receiveShadow=true;
scene.add(grass);

// roadside posts + guard rails
const postGeo=new THREE.BoxGeometry(0.4,1.2,0.4),postMat=new THREE.MeshStandardMaterial({color:0xf5c518,emissive:0x443300});
const POST_GAP=80*S,POST_N=Math.ceil(ROAD_LEN/POST_GAP);
const posts=[];
for(let i=0;i<POST_N;i++)for(const s of[-1,1]){
  const m=new THREE.Mesh(postGeo,postMat);m.position.set(s*(ROAD_W*S/2+1.2),0.6,0);m.castShadow=true;scene.add(m);posts.push({m,i});
}
for(const s of[-1,1]){
  const rail=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.4,ROAD_LEN),new THREE.MeshStandardMaterial({color:0x9aa0aa,metalness:.6,roughness:.4}));
  rail.position.set(s*(ROAD_W*S/2+0.7),0.7,-ROAD_LEN/2+30);scene.add(rail);
}
// trees on both sides
const trees=[];
const trunkGeo=new THREE.CylinderGeometry(.25,.35,2,6),leafGeo=new THREE.ConeGeometry(1.5,4,7);
const trunkMat=new THREE.MeshStandardMaterial({color:0x5a3a1e}),leafMat=new THREE.MeshStandardMaterial({color:0x1f5a2a});
const TREE_GAP=9,TREE_N=Math.ceil(ROAD_LEN/TREE_GAP);
for(let i=0;i<TREE_N;i++)for(const s of[-1,1]){
  const g=new THREE.Group();
  const tr=new THREE.Mesh(trunkGeo,trunkMat);tr.position.y=1;
  const lf=new THREE.Mesh(leafGeo,leafMat);lf.position.y=4;
  g.add(tr,lf);
  const off=4+((i*37+(s>0?11:0))%7);
  g.position.x=s*(ROAD_W*S/2+off);g.scale.setScalar(.8+((i*13)%5)*.12);
  scene.add(g);trees.push({g,i});
}

// ===== models =====
const matCache={};
const stdMat=(c,o={})=>{const k=c+JSON.stringify(o);return matCache[k]||(matCache[k]=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.45,metalness:.3},o)));};
const glass=stdMat(0x142033,{roughness:.1,metalness:.8});
const lampMat=new THREE.MeshStandardMaterial({color:0xfff9c4,emissive:0xfff9c4,emissiveIntensity:2});
const tailMat=new THREE.MeshStandardMaterial({color:0xff2222,emissive:0xff0000,emissiveIntensity:1.5});
const wheelMat=stdMat(0x111111,{roughness:.9,metalness:0});
const wheelGeo=new THREE.CylinderGeometry(.42,.42,.35,14);wheelGeo.rotateZ(Math.PI/2);
function add(g,geo,mat,x,y,z,shadow=true){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=shadow;g.add(m);return m;}
// front faces -Z locally
function buildCar(w,h,col,ownLamp=true){
  const g=new THREE.Group(),W3=w*S,L=h*S;
  add(g,new THREE.BoxGeometry(W3,.7,L),stdMat(col),0,.6,0);
  add(g,new THREE.BoxGeometry(W3*.84,.6,L*.5),glass,0,1.2,L*.05);
  add(g,new THREE.BoxGeometry(W3*.8,.12,L*.42),stdMat(col),0,1.55,L*.05);
  for(const sx of[-1,1]){
    add(g,new THREE.BoxGeometry(.4,.2,.1),lampMat,sx*W3*.33,.7,-L/2);
    add(g,new THREE.BoxGeometry(.4,.2,.1),tailMat,sx*W3*.33,.7,L/2);
    for(const sz of[-1,1])add(g,wheelGeo,wheelMat,sx*W3/2,.42,sz*L*.32);
  }
  return g;
}
function stripeTexture(){
  const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,64,64);g.fillStyle='#e53935';
  for(let x=-64;x<128;x+=32){g.beginPath();g.moveTo(x,64);g.lineTo(x+16,64);g.lineTo(x+80,0);g.lineTo(x+64,0);g.fill();}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;return t;
}
const stripeTex=stripeTexture();
function buildBarrier(w,h,height,cones){
  const g=new THREE.Group();
  const tx=stripeTex.clone();tx.needsUpdate=true;tx.repeat.set(w*S/1.5,1);
  add(g,new THREE.BoxGeometry(w*S,height,h*S),new THREE.MeshStandardMaterial({map:tx,roughness:.6}),0,height/2,0);
  const lamps=[];
  for(const sx of[-1,1]){
    const l=add(g,new THREE.SphereGeometry(.25,10,8),new THREE.MeshStandardMaterial({color:0xffd400,emissive:0xffd400,emissiveIntensity:0}),sx*(w*S/2-.3),height+.2,0,false);
    lamps.push(l);
  }
  if(cones){
    for(let i=0;i<4;i++)add(g,new THREE.ConeGeometry(.4,1.1,10),stdMat(0xff7a00),-w*S/2+w*S*(i+.5)/4,height+.55,0);
  }
  g.userData.lamps=lamps;
  return g;
}
function buildTruck(w,h,col){
  const g=buildCar(w,h,col);
  g.scale.y=1.7;
  const L=h*S;
  add(g,new THREE.BoxGeometry(w*S-.3,.4,L*.5),stdMat(0xd33),0,2.4/1.7*1.0,L*.15);
  return g;
}
function buildSportsCar(w,h,col){
  const g=new THREE.Group(),W3=w*S,L=h*S,body=stdMat(col,{roughness:.25,metalness:.6}),dark=stdMat(0x111111,{roughness:.6});
  g.userData.body=[];
  const b=(geo,m,x,y,z)=>{const o=add(g,geo,m,x,y,z);if(m===body)g.userData.body.push(o);return o;};
  b(new THREE.BoxGeometry(W3*1.04,.36,L),body,0,.45,0);                 // low wide chassis
  const nose=b(new THREE.BoxGeometry(W3*.96,.2,L*.3),body,0,.55,-L*.4);nose.rotation.x=.18; // sloped nose
  b(new THREE.BoxGeometry(W3*.96,.28,L*.3),body,0,.62,L*.33);            // rear deck
  b(new THREE.BoxGeometry(W3*.7,.4,L*.34),glass,0,.85,L*.02);            // low cabin
  const roof=b(new THREE.BoxGeometry(W3*.6,.08,L*.2),body,0,1.07,L*.06);roof.rotation.x=0;
  b(new THREE.BoxGeometry(.18,.06,L*.6),dark,0,.66,-L*.15);               // hood stripe
  b(new THREE.BoxGeometry(W3*1.08,.06,.5),dark,0,.25,-L/2);               // front splitter
  b(new THREE.BoxGeometry(W3*1.05,.08,.5),body,0,1.0,L/2+.05);            // rear wing
  for(const sx of[-1,1]){
    b(new THREE.BoxGeometry(.08,.35,.45),body,sx*W3*.44,.85,L/2);        // wing supports
    add(g,new THREE.BoxGeometry(.5,.12,.1),lampMat,sx*W3*.36,.55,-L/2-.1);
    add(g,new THREE.BoxGeometry(.5,.12,.1),tailMat,sx*W3*.36,.6,L/2);
    for(const sz of[-1,1]){const wh=add(g,wheelGeo,wheelMat,sx*W3*.52,.45,sz*L*.3);wh.scale.set(1.3,1.1,1.1);}
  }
  return g;
}
function buildTank(w,h,col){
  const g=new THREE.Group(),W3=w*S,L=h*S;
  const body=stdMat(col,{roughness:.75,metalness:.25});
  const dark=stdMat(0x3a4a18,{roughness:.8,metalness:.2});
  const track=stdMat(0x1a1a1a,{roughness:.9,metalness:.1});
  const metal=stdMat(0x333333,{roughness:.5,metalness:.6});
  // 左右キャタピラ（無限軌道）

function spawnRow(){
  const blocked=new Array(LANES).fill(false);
  // 出現位置付近にまだ前の車や障害物が残っているレーンを除外（出現時の重なり防止）
  for(const c of cars){
    if(c.y<SPAWN_Y+170){
      for(let l=0;l<LANES;l++)if(Math.abs(c.x-laneX(l))<(c.w+LW)/2)blocked[l]=true;
    }
  }
  const r=Math.random(),lateGame=speed>260;
  if(r<0.16){
    const k=Math.random()*(LANES-1)|0;
    if(!blocked[k]&&!blocked[k+1]){
      addObj({kind:'truck',x:ROAD_L+LW*(k+1),w:LW*2-8,h:130,own:20+Math.random()*40});
      blocked[k]=blocked[k+1]=true;
    }
  }else if(r<0.32){
    let bs=[1+(Math.random()*4|0)];
    if(Math.random()<0.35){const b2=bs[0]<=2?bs[0]+2:bs[0]-2;bs.push(b2);}
    for(const b of bs){
      if(!blocked[b-1]&&!blocked[b]){
        addObj({kind:'barrier',x:ROAD_L+LW*b,w:60,h:28,own:0});
        blocked[b-1]=blocked[b]=true;
      }
    }
  }else if(r<0.38){
    const k=Math.random()*(LANES-1)|0;
    if(!blocked[k]&&!blocked[k+1]){
      addObj({kind:'work',x:ROAD_L+LW*(k+1),w:LW*2-6,h:34,own:0});
      blocked[k]=blocked[k+1]=true;
    }
  }
  const free=[0,1,2,3,4].filter(l=>!blocked[l]).sort(()=>Math.random()-.5);
  const want=Math.random()<0.25?3:Math.random()<0.6?2:1;
  const n=Math.max(0,Math.min(want,free.length-1));
  for(let i=0;i<n;i++){
    const l=free[i],lx=laneX(l);
    // その車線の前方が空いているかチェック（前の車に詰まって減速するのを防ぐため）
    const laneClear=!cars.some(c=>Math.abs(c.x-lx)<LW*0.7);
    // 前方がクリア ＆ 5%の確率で超高速スポーツカーを出現させる
    if(laneClear&&Math.random()<0.05){
      const sCols=[0xffc400,0xff1744,0x00e5ff,0xd500f9]; // スポーツカー専用の派手な色
      addObj({kind:'sport',x:lx,w:38,h:CH,
        own:1000+Math.random()*140,
        col:sCols[Math.random()*sCols.length|0],
        chase:false}); // まっすぐ猛スピードで突っ込んでくる
    }else{
      // 通常の車（遅い車: 25〜55 / 普通: 80〜140 / 速い車: 190〜280）
      const sr=Math.random();
      const ownSpd=sr<0.3?25+Math.random()*30:sr<0.75?80+Math.random()*60:190+Math.random()*90;
      addObj({x:lx+(Math.random()-.5)*20,w:44,h:CH+Math.random()*10,
        own:ownSpd,col:COLORS[Math.random()*COLORS.length|0],
        chase:lateGame&&Math.random()<0.3});
    }
  }
}

function update(dt){
  t+=dt;
  const curCar=CARS[carType],pw=curCar.w,ph=curCar.h;
  boost+=((boostT>0?1:0)-boost)*Math.min(1,dt*5);
  if(state==='play'){
    speed+=(28+speed*0.035)*curCar.acc*dt;
    if(unlockT>0)unlockT-=dt;if(boostT>0)boostT-=dt;if(cdT>0)cdT-=dt;
    if(charges<MAXC){rechT+=dt;if(rechT>=RECH){rechT=0;charges++;}}else rechT=0;
    const kx=(keys.ArrowRight||keys.d||keys.D?1:0)-(keys.ArrowLeft||keys.a||keys.A?1:0)+touchDir;
    const ky=(keys.ArrowDown||keys.s||keys.S?1:0)-(keys.ArrowUp||keys.w||keys.W?1:0);
    const steer=(260+speed*0.25)*curCar.steer;
    player.vx+=(kx*steer-player.vx)*Math.min(1,dt*9*curCar.steer);
    player.vy+=(ky*180-player.vy)*Math.min(1,dt*6);
    player.x=Math.max(ROAD_L+pw/2+2,Math.min(ROAD_L+ROAD_W-pw/2-2,player.x+player.vx*dt));
    player.y=Math.max(H*0.35,Math.min(H-90,player.y+player.vy*dt));
    dist+=speed*(1+BOOST_K*boost)*dt;
    comboT-=dt;if(comboT<=0)combo=0;
    spawnT-=dt;
    if(spawnT<=0){spawnRow();spawnT=Math.max(0.28,(420/(speed*(1+BOOST_K*boost)+90)))*(0.8+Math.random()*0.5);}
    score+=speed*(1+BOOST_K*boost)*dt*0.05;
    if(unlockLv<1&&score>=1000){unlockLv=1;localStorage.setItem('wwr_unlock','1');unlockText='NEW CAR UNLOCKED: PHANTOM X !';unlockT=4;}
    if(unlockLv<2&&score>=3000){unlockLv=2;localStorage.setItem('wwr_unlock','2');unlockText='NEW CAR UNLOCKED: TITAN TANK !';unlockT=4;}
  }
  // 戦車の砲弾移動と障害物爆破判定
  for(const s of shells){
    s.y+=s.vy*dt;
    s.m.position.set(gx(s.x),1.15,gz(s.y));
    if(s.y<SPAWN_Y-100){s.alive=false;continue;}
    for(const c of cars){
      if(c.dead)continue;
      if(Math.abs(c.x-s.x)<c.w/2+16&&Math.abs(c.y-s.y)<c.h/2+18){
        s.alive=false;
		playHitSe();
        shake=Math.max(shake,16);flash=Math.max(flash,0.35);
        // 着弾点の障害物および隣接する障害物をまとめて爆散させる
        for(const c2 of cars){
          if(!c2.dead&&Math.abs(c2.x-c.x)<75&&Math.abs(c2.y-c.y)<95){
            c2.dead=true;boom(c2.x,c2.y);scene.remove(c2.mesh);
          }
        }
        break;
      }
    }
  }
  shells=shells.filter(s=>{if(s.alive)return true;scene.remove(s.m);return false;});
  cars=cars.filter(c=>!c.dead);

  // 【変更後】
  for(const c of cars){
    c.y+=(speed*(1+BOOST_K*boost)+c.own)*dt;
    // 1. ふらつく車の横移動（移動先に他の車・障害物がない場合のみ移動）
    if(c.chase&&state==='play'&&c.y<player.y-140){
      const d=player.x-c.x;
      const nx=Math.max(ROAD_L+c.w/2+4,Math.min(ROAD_L+ROAD_W-c.w/2-4,c.x+Math.max(-1,Math.min(1,d/20))*55*dt));
      const hitX=cars.some(o=>o!==c&&!o.dead&&Math.abs(nx-o.x)<(c.w+o.w)/2+10&&Math.abs(c.y-o.y)<(c.h+o.h)/2+14);
      if(!hitX)c.x=nx;
    }
    // 2. 速度差による縦方向の追突防止（前方に遅い車や障害物があれば減速して車間維持）
    if(c.own>0){
      for(const o of cars){
        if(o===c||o.dead||o.y<=c.y)continue;
        const minY=(c.h+o.h)/2+20;
        if(Math.abs(c.x-o.x)<(c.w+o.w)/2+6&&o.y-c.y<minY){
          c.y=o.y-minY;
          if(c.own>o.own)c.own=o.own;
        }
      }
    }
    if(state==='play'){
      const dx=Math.abs(c.x-player.x),dy=Math.abs(c.y-player.y);
      if(dx<(c.w+pw)/2-4&&dy<(c.h+ph)/2-6){
        state='over';stopBgm();boom(player.x,player.y);shake=25;flash=1;playCutin();
        playerMesh.visible=false;
        if(score>best){
          best=Math.floor(score);localStorage.setItem('wwr_best',best);
          if(best>=3000&&unlockLv<2){unlockLv=2;localStorage.setItem('wwr_unlock','2');}
          else if(best>=1000&&unlockLv<1){unlockLv=1;localStorage.setItem('wwr_unlock','1');}
        }
        rankForm.style.display='flex';
        sendBtn.disabled=false;sendBtn.textContent='スコア登録';
        fetchRanks();
      }
      if(!c.passed&&c.y>player.y){
        c.passed=true;
        const gap=dx-(c.w+pw)/2;
        if(gap<14){
          combo++;comboT=2.2;near++;
          const bonus=Math.floor((14-gap)*10+50)*combo;
          score+=bonus;
          const el=document.createElement('div');el.className='pop';
          el.textContent=`NEAR MISS +${bonus}`+(combo>1?` x${combo}`:'');
          $('pops').appendChild(el);
          popups.push({x:c.x,y:player.y,life:1,el,h:0});
        }
      }
    }
    c.mesh.position.set(gx(c.x),0,gz(c.y));
    const lamps=c.mesh.userData.lamps;
    if(lamps){const on=Math.floor(t*6)%2===0?3:0;for(const l of lamps)l.material.emissiveIntensity=on;}
  }
  cars=cars.filter(c=>{if(c.y<H+150)return true;scene.remove(c.mesh);return false;});
  for(const p of parts){
    p.vy-=25*dt;p.m.position.x+=p.vx*dt;p.m.position.y=Math.max(.05,p.m.position.y+p.vy*dt);p.m.position.z+=p.vz*dt;
    p.life-=dt;p.m.material.opacity=Math.min(1,p.life*2);
  }
  parts=parts.filter(p=>{if(p.life>0)return true;scene.remove(p.m);return false;});
  for(const p of parts2){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.98;p.vy*=0.98;p.life-=dt;}
  parts2=parts2.filter(p=>p.life>0);
  for(const p of popups){p.life-=dt;p.h+=1.5*dt;}
  popups=popups.filter(p=>{if(p.life>0)return true;p.el.remove();return false;});
  shake*=0.9;flash*=0.9;
}

  for(let y=-80+off;y<H;y+=80){ctx.fillRect(8,y,8,22);ctx.fillRect(W-16,y,8,22);}
  const k=Math.min(1,speed/900);
  ctx.fillStyle=`rgba(255,255,255,${0.04+k*0.12})`;
  for(let i=0;i<14;i++){const sx=(i*97)%W,sy=((i*211+dist*1.3)%H);ctx.fillRect(sx,sy,2,20+k*60);}
}
function draw2D(){
  // fit canvas (480x720) to the window keeping aspect
  const sc=Math.min(innerWidth/W,innerHeight/H);
  c2d.style.width=W*sc+'px';c2d.style.height=H*sc+'px';
  ctx.save();
  ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  road2D();
  for(const c of cars)obj2D(c);
  // 2D視点での砲弾描画
  ctx.fillStyle='#ffe066';
  for(const s of shells){ctx.beginPath();ctx.arc(s.x,s.y,5,0,7);ctx.fill();}
  const cur=CARS[carType];
  if(state!=='over'){
    if(cur.tank)tank2D(player.x,player.y,cur.w,cur.h,hex(cur.col));
    else car2D(player.x,player.y,cur.w,cur.h,hex(cur.col),false,true);
  }
  for(const p of parts2){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s);}
  ctx.globalAlpha=1;
  ctx.restore();
  const k=Math.min(1,speed/1000);
  const g=ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.75);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(120,0,0,${0.2+k*0.5})`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

// ===== render sync =====
const tmp=new THREE.Vector3();
function render(){
  // player
  const px=gx(player.x),pz=gz(player.y);
  playerMesh.position.set(px,0,pz);
  playerMesh.rotation.y=-player.vx*0.0012;
  playerMesh.rotation.z=-player.vx*0.0004;
  // road scrolling
  roadTex.offset.y=(dist/80)%1;
  for(const p of posts){p.m.position.z=30-POST_N*POST_GAP+((p.i*POST_GAP+dist*S)%(POST_N*POST_GAP));}
  for(const o of trees){o.g.position.z=30-TREE_N*TREE_GAP+((o.i*TREE_GAP+dist*S)%(TREE_N*TREE_GAP));}
  // camera
  const k=Math.min(1,speed/900);
  if(view==='2d'){draw2D();}
  else{
    stdModel.visible=carType===0&&view!=='fps';
    sportModel.visible=carType===1&&view!=='fps';
    tankModel.visible=carType===2&&view!=='fps';
    if(view==='fps'){
      camera.fov=70+k*25+boost*10;camera.updateProjectionMatrix();
      camera.position.set(px+(Math.random()-.5)*shake*.03,1.25+(Math.random()-.5)*shake*.03,pz-0.2);
      camera.lookAt(px+player.vx*0.004,1.2,pz-20);
      camera.rotation.z+=-player.vx*0.0002;
    }else{
      camera.fov=62+k*22+boost*10;camera.updateProjectionMatrix();
      const cx=px*0.6;
      camera.position.set(cx+(Math.random()-.5)*shake*.03,4.2-k*0.8+(Math.random()-.5)*shake*.03,pz+9.5);
      camera.lookAt(px*0.85,1.0,pz-14);
      camera.rotation.z+=-player.vx*0.00015;
    }
    sun.position.set(px-8,20,pz+10);sun.target.position.set(px,0,pz-5);
    renderer.render(scene,camera);
  }
  // HUD
  const cur=CARS[carType];
  $('score').textContent=`SCORE ${Math.floor(score)}`;
  $('best').textContent=`BEST ${best}`;
  $('kmh').textContent=`${Math.floor(speed*(1+BOOST_K*boost)*0.6)} km/h`;
  $('near').textContent=`NEAR ${near}`;
  if(cur.tank){
    $('turbo').textContent='CANNON '+'●'.repeat(charges)+'○'.repeat(MAXC-charges);
  }else{
    $('turbo').textContent='TURBO '+'●'.repeat(charges)+'○'.repeat(MAXC-charges)+(boostT>0?' BOOST!':cdT>0?' COOL':'');
  }
  $('unlockMsg').textContent=unlockT>0?unlockText:'';$('combo').textContent=combo>1&&state==='play'?`COMBO x${combo}`:'';
  for(const p of popups){
    if(view==='2d'){
      const r=c2d.getBoundingClientRect();
      p.el.style.left=(r.left+p.x/W*r.width)+'px';p.el.style.top=(r.top+(p.y-30-p.h*20)/H*r.height)+'px';
    }else{
      tmp.set(gx(p.x),1.5+p.h,gz(p.y)-1).project(camera);
      p.el.style.left=((tmp.x+1)/2*innerWidth)+'px';p.el.style.top=((1-tmp.y)/2*innerHeight)+'px';
    }
    p.el.style.opacity=Math.min(1,p.life*2);
  }
  $('ctl').style.display=state==='play'?'flex':'none';$('resetBest').style.display=(state!=='play'&&!cutinOn)?'block':'none';
  const btn=$('carBtn'),rBtn=$('rankBtn');
  btn.style.display=(unlockLv>0&&state!=='play'&&!cutinOn)?'block':'none';
  btn.textContent='車種: '+cur.name;
  rBtn.style.display=(state!=='play'&&!cutinOn)?'block':'none';
  rBtn.textContent=state==='over'?'🏆 ランキング / 登録':'🏆 ランキング';
  const panel=$('panel');
  if(state==='title'||(state==='over'&&!cutinOn)){
    panel.style.display='block';
    if(state==='title')panel.innerHTML=`<h1>WRONG WAY RUSH</h1>対向車をよけ続けろ。速度は上がり続ける<br>ギリギリですれ違うとボーナス!<br>${Math.floor(t*2)%2===0?'<span class="go">タップでスタート</span>':'&nbsp;'}`;
    else panel.innerHTML=`<h1>CRASH!</h1>SCORE ${Math.floor(score)} NEAR MISS ${near}<br>BEST ${best}<br><span class="go">タップでスタート</span>`;
    let subMsg='';
    if(unlockLv===0)subMsg='SCORE 1000 で新車「PHANTOM X」解放!';
    else if(unlockLv===1)subMsg=`現在の車: ${cur.name}${cur.desc} ボタンで変更`;
    else subMsg=`現在の車: ${cur.name}${cur.desc} ボタンで変更`;
    panel.innerHTML+='<br><small>'+subMsg+'</small>';
  }else panel.style.display='none';
  $('flash').style.opacity=flash>0.05?flash:0;
  $('vig').style.background=`radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(120,0,0,${0.2+Math.min(1,speed/1000)*0.5}) 100%)`;
}
let last=performance.now();
function loop(now){
  const dt=Math.min(0.03,(now-last)/1000);last=now;
  update(dt);
  if(state==='title'){
    for(const c of cars)scene.remove(c.mesh);cars=[];
    for(const s of shells)scene.remove(s.m);shells=[];
  }
  render();requestAnimationFrame(loop);
}

// ===== cut-in video & input =====
const cutin=$('cutin');
let cutinOn=false,cutinTimer=null,videoWarmed=false;

// WebM対応ブラウザなら gyakusou.webm を優先、非対応または取得失敗時は mp4 にフォールバック
const canWebm=cutin.canPlayType('video/webm')!=='';
const videoList=canWebm?['movies/gyakusou.webm','movies/gyakusou.mp4']:['movies/gyakusou.mp4','movies/gyakusou.webm'];

async function preloadVideo(){
  for(const url of videoList){
    try{
      const r=await fetch(url);
      if(!r.ok)continue;
      const blob=await r.blob();
      cutin.src=URL.createObjectURL(blob);
      cutin.load();
      return;
    }catch(e){}
  }
  cutin.src=videoList[0];
  cutin.load();
}
preloadVideo();

// 初回スタート時のユーザー操作イベント内でデコーダ起動＆音声ロック解除を行う
let audioWarmed=false;
function warmupVideo(){
  // 音声(SE・待機BGM)のデコーダ起動＆スマホでの再生ロック解除
  if(!audioWarmed){
    audioWarmed=true;
    for(const a of [fireSe,hitSe,...bgms.filter((_,i)=>i!==carType)]){
      if(!a.src)continue;
      a.muted=true;
      const pa=a.play();
      if(pa!==undefined){
        pa.then(()=>{a.pause();a.currentTime=0;a.muted=false;}).catch(()=>{a.muted=false;});
      }
    }
  }
  // カットイン動画のウォームアップ
  if(videoWarmed||!cutin.src)return;
  videoWarmed=true;
  const prevMuted=cutin.muted;
  cutin.muted=true;
  const p=cutin.play();
  if(p!==undefined){
    p.then(()=>{
      if(!cutinOn){
        cutin.pause();
        cutin.currentTime=0;
      }
      cutin.muted=prevMuted;
    }).catch(()=>{
      cutin.muted=prevMuted;
    });
  }
}

function playCutin(){
  cutinOn=true;clearTimeout(cutinTimer);
  cutin.currentTime=0;
  cutin.classList.add('on');
  cutin.play().catch(()=>{cutin.muted=true;cutin.play().catch(endCutin);});
}
function endCutin(){
  cutinOn=false;clearTimeout(cutinTimer);
  cutin.pause();
  cutin.classList.remove('on');
  if(cutin.readyState>=2)cutin.currentTime=0;
}
cutin.addEventListener('ended',endCutin);
cutin.addEventListener('error',endCutin);
cutin.addEventListener('click',endCutin);
function start(){
  if(rankOpen)return;
  if(cutinOn){endCutin();return;}
  if(state!=='play'){warmupVideo();reset();}
}
addEventListener('keydown',e=>{
  if(rankOpen){if(e.key==='Escape')closeRank();return;}
  keys[e.key]=true;
  if(e.key==='c'||e.key==='C')toggleCar();
  if(e.key==='v'||e.key==='V')setView(VIEWS[(VIEWS.indexOf(view)+1)%VIEWS.length]);
  if(e.key===' '){e.preventDefault();if(state==='play'){if(!e.repeat)useTurbo();}else start();}
  else if(e.key==='Enter'){e.preventDefault();start();}
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
});
addEventListener('keyup',e=>keys[e.key]=false);
for(const el of[cv,c2d])el.addEventListener('mousedown',start);
// mobile: steering by left/right half of the screen (multi-touch aware), on-screen buttons for turbo / forward / back
function touch(e){
  e.preventDefault();
  if(state!=='play'){if(e.type==='touchstart')start();touchDir=0;return;}
  let d=0;
  for(const t of e.touches){
    if(t.target!==cv&&t.target!==c2d)continue;
    d=t.clientX<innerWidth/2?-1:1;
  }
  touchDir=d;
}
for(const el of[cv,c2d]){
  el.addEventListener('touchstart',touch,{passive:false});
  el.addEventListener('touchmove',touch,{passive:false});
  el.addEventListener('touchend',touch,{passive:false});
  el.addEventListener('touchcancel',touch,{passive:false});
}
function holdBtn(id,down,up){
  const el=$(id);
  const on=e=>{e.preventDefault();e.stopPropagation();el.classList.add('on');down();};
  const off=e=>{e.preventDefault();e.stopPropagation();el.classList.remove('on');up&&up();};
  el.addEventListener('touchstart',on,{passive:false});
  el.addEventListener('touchend',off,{passive:false});
  el.addEventListener('touchcancel',off,{passive:false});
  el.addEventListener('mousedown',on);
  el.addEventListener('mouseup',off);
  el.addEventListener('mouseleave',off);
}
holdBtn('bTurbo',()=>{if(state==='play')useTurbo();else start();});
holdBtn('bUp',()=>{keys.ArrowUp=true;},()=>{keys.ArrowUp=false;});
holdBtn('bDn',()=>{keys.ArrowDown=true;},()=>{keys.ArrowDown=false;});
// stop pinch-zoom / double-tap zoom / pull-to-refresh
for(const ev of['gesturestart','gesturechange','gestureend'])document.addEventListener(ev,e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('visibilitychange',()=>{touchDir=0;keys.ArrowUp=keys.ArrowDown=false;});
document.querySelectorAll('#views button').forEach(b=>b.addEventListener('click',e=>{e.currentTarget.blur();setView(b.dataset.v);}));
setView(view);
$('carBtn').addEventListener('click',e=>{e.currentTarget.blur();toggleCar();});$('resetBest').addEventListener('click',e=>{
  e.currentTarget.blur();
  if(confirm('ハイスコアをリセットしますか？')){best=0;localStorage.removeItem('wwr_best');}
});

// ===== online ranking =====
const RANK_API = 'https://script.google.com/macros/s/AKfycbwKLzHyLJAYaqw7Qa3L6NfD_cSbA1yfHzQ1SPCaM7n8U_VY9rBR1ShQXQB-5UD9ZQgj/exec';
const rankWrap = $('rankWrap'), rankBox =$('rankBox'), rankList = $('rankList'), rankForm =$('rankForm');
const pName = $('pName'), sendBtn =$('sendBtn'), rankBtn = $('rankBtn'), closeRankBtn =$('closeRankBtn');
pName.value = localStorage.getItem('wwr_name') || '';

function openRank() {
  if (state === 'play' || cutinOn) return;
  rankOpen = true;
  if (state !== 'over') rankForm.style.display = 'none';
  rankWrap.style.display = 'flex';
  fetchRanks();
}
function closeRank() {
  rankOpen = false;
  rankWrap.style.display = 'none';
  pName.blur();
}

rankBtn.addEventListener('click', e => { e.stopPropagation(); e.currentTarget.blur(); openRank(); });
closeRankBtn.addEventListener('click', e => { e.stopPropagation(); closeRank(); });
// モーダルの外側（黒い背景）をタップしたときも閉じる
rankWrap.addEventListener('click', e => { if (e.target === rankWrap) closeRank(); });

// 入力欄やモーダル操作時に裏のゲームが誤作動・スクロール禁止にならないようにする
rankBox.addEventListener('mousedown', e => e.stopPropagation());
rankBox.addEventListener('touchstart', e => e.stopPropagation(), {passive: true});
rankWrap.addEventListener('touchmove', e => e.stopPropagation(), {passive: true});
pName.addEventListener('keydown', e => e.stopPropagation());

function renderRanks(list) {
  if (!list || !list.length) { rankList.innerHTML = 'まだ記録がありません'; return; }
  rankList.innerHTML = list.map((r, i) =>
    `<div>${String(i + 1).padStart(2, ' ')}. <b>${r.name.replace(/[<>&]/g, '')}</b> : ${r.score}</div>`
  ).join('');
}

async function fetchRanks() {
  if (!RANK_API.startsWith('http')) { rankList.innerHTML = 'URL未設定'; return; }
  rankList.innerHTML = '読み込み中...';
  try {
    const res = await fetch(RANK_API);
    renderRanks(await res.json());
  } catch (e) {
    rankList.innerHTML = '取得失敗';
  }
}

sendBtn.addEventListener('click', async () => {
  const name = pName.value.trim() || 'NO NAME';
  localStorage.setItem('wwr_name', name);
  sendBtn.disabled = true;
  sendBtn.textContent = '送信中...';
  try {
    const res = await fetch(RANK_API, {
      method: 'POST',
      body: JSON.stringify({ name, score: Math.floor(score), car: CARS[carType].name })
    });
    renderRanks(await res.json());
    rankForm.style.display = 'none';
  } catch (e) {
    sendBtn.textContent = '再送信';
    sendBtn.disabled = false;
  }
});

requestAnimationFrame(loop);
</script>
